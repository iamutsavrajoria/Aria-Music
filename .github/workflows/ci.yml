# SPDX-License-Identifier: GPL-3.0-only
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: write }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: No destructive migration
        run: scripts/check-no-destructive-migration.sh
      - name: Build-logic tests
        run: scripts/ci-gradle.sh -p buildSrc test
      - name: Module graph
        run: scripts/ci-gradle.sh checkModuleGraph
      - name: Build and test
        run: scripts/ci-gradle.sh build test
      - name: Publish generated Room schema to a branch (temporary bootstrap)
        if: always()
        run: |
          set -x
          ls -R data/schemas || true
          git config user.name "ci-bootstrap"; git config user.email "ci@users.noreply.github.com"
          git checkout -B schema-bootstrap
          git add -f data/schemas
          git commit -m "bootstrap: generated Room schema" || exit 0
          git push -f origin schema-bootstrap
