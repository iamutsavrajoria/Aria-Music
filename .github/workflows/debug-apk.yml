# SPDX-License-Identifier: GPL-3.0-only
name: debug-apk
on:
  workflow_dispatch:   # manual only: artifacts on a public repo are world-downloadable
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: scripts/ci-gradle.sh :app:assembleFossDebug :app:assembleGmsDebug
      # Not private: anyone signed in to GitHub can download this while the repo is public.
      # Kept 1 day, no release is created. Download it, then delete the run (gh run delete <id>).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aria-debug-${{ github.sha }}
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 1
          if-no-files-found: error
