# SPDX-License-Identifier: GPL-3.0-only
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Static checks
        run: |
          python3 -m pip install pytest
          python3 -m pytest scripts -q
          python3 scripts/check-provenance.py .
          scripts/check-backup-rules.sh
          scripts/check-no-destructive-migration.sh
          scripts/check-actions-pinned.sh
          # TODO (controller): add `test -f gradle/verification-metadata.xml` here once the file is committed (Step 5b.4).
      - name: Build-logic tests (module-graph rules)
        run: scripts/ci-gradle.sh -p buildSrc test
      - name: Module graph
        run: scripts/ci-gradle.sh checkModuleGraph
      - name: Build and unit tests (all modules, lint included)
        run: scripts/ci-gradle.sh build test
      - name: Build both flavors
        run: scripts/ci-gradle.sh :app:assembleFossDebug :app:assembleGmsDebug
      - name: Schema is committed and unchanged
        # git diff ignores untracked files, so a forgotten new version file (2.json) would pass; status sees both.
        run: |
          out="$(git status --porcelain -- data/schemas)"
          if [ -n "$out" ]; then echo "Room schema changed or uncommitted:"; echo "$out"; exit 1; fi
      - name: Dependency licenses
        # The license plugin needs --no-parallel on Gradle 9 multi-project builds.
        run: scripts/ci-gradle.sh checkLicense --no-parallel
      - name: List disallowed license names (temporary diagnostic)
        if: failure()
        run: |
          f=build/reports/dependency-license/dependencies-without-allowed-license.json
          if [ -f "$f" ]; then echo "::error title=license-names::$(python3 scripts/license-names.py "$f" | sed 's/%/%25/g')"; fi
          exit 0
  # UNVERIFIED locally (no emulator available when this job was written): first CI run is its real test.
  glass-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { api: [26, 34] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: scripts/ci-gradle.sh :designsystem:connectedDebugAndroidTest
