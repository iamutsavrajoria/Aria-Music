# SPDX-License-Identifier: GPL-3.0-only
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: write }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: No destructive migration
        run: scripts/check-no-destructive-migration.sh
      - name: Build-logic tests
        run: scripts/ci-gradle.sh -p buildSrc test
      - name: Module graph
        run: scripts/ci-gradle.sh checkModuleGraph
      - name: Build and test
        run: scripts/ci-gradle.sh build test
      - name: Report generated Room schema (temporary bootstrap)
        if: always()
        run: |
          out="$( { ls -R data/schemas; find . -name "*AriaDatabase*" -not -path "*/.git/*" | head -20; grep -n "schema" data/build.gradle.kts; } 2>&1 )"
          echo "::error title=schema-info::$(printf '%s' "$out" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          f=$(find data -path '*schemas*' -name '*.json' | head -1)
          [ -n "$f" ] && echo "::error title=schema-json::$(base64 -w0 "$f")"
          exit 0
