# SPDX-License-Identifier: GPL-3.0-only
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: No destructive migration
        run: scripts/check-no-destructive-migration.sh
      - name: Backup rules and no analytics
        run: scripts/check-backup-rules.sh
      - name: Build-logic tests
        run: scripts/ci-gradle.sh -p buildSrc test
      - name: Module graph
        run: scripts/ci-gradle.sh checkModuleGraph
      - name: Build and test
        run: scripts/ci-gradle.sh build test
