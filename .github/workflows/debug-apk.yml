# SPDX-License-Identifier: GPL-3.0-only
name: debug-apk
on:
  workflow_dispatch:   # manual only: artifacts on a public repo are world-downloadable
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: scripts/ci-gradle.sh :app:assembleFossDebug :app:assembleGmsDebug
      # Not private: anyone signed in to GitHub can download this while the repo is public.
      # Kept 1 day, no release is created. Download it, then delete the run (gh run delete <id>).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aria-debug-${{ github.sha }}
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 1
          if-no-files-found: error
