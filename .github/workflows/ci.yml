# SPDX-License-Identifier: GPL-3.0-only
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Static checks
        run: |
          python3 -m pip install pytest
          python3 -m pytest scripts -q
          python3 scripts/check-provenance.py .
          scripts/check-backup-rules.sh
          scripts/check-no-destructive-migration.sh
          scripts/check-actions-pinned.sh
          # TODO (controller): add `test -f gradle/verification-metadata.xml` here once the file is committed (Step 5b.4).
      - name: Build-logic tests (module-graph rules)
        run: scripts/ci-gradle.sh -p buildSrc test
      - name: Module graph
        run: scripts/ci-gradle.sh checkModuleGraph
      - name: Build and unit tests (all modules, lint included)
        run: scripts/ci-gradle.sh build test
      - name: Build both flavors
        run: scripts/ci-gradle.sh :app:assembleFossDebug :app:assembleGmsDebug
      - name: Schema is committed and unchanged
        # git diff ignores untracked files, so a forgotten new version file (2.json) would pass; status sees both.
        run: |
          out="$(git status --porcelain -- data/schemas)"
          if [ -n "$out" ]; then echo "Room schema changed or uncommitted:"; echo "$out"; exit 1; fi
      - name: Dependency licenses
        # The license plugin needs --no-parallel on Gradle 9 multi-project builds.
        run: scripts/ci-gradle.sh checkLicense --no-parallel
  # UNVERIFIED locally (no emulator available when this job was written): first CI run is its real test.
  glass-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { api: [26, 34] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: scripts/ci-gradle.sh :designsystem:connectedDebugAndroidTest
