# SPDX-License-Identifier: GPL-3.0-only
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Static checks
        run: |
          python3 -m pip install pytest
          python3 -m pytest scripts -q
          python3 scripts/check-provenance.py .
          scripts/check-backup-rules.sh
          scripts/check-no-destructive-migration.sh
          scripts/check-actions-pinned.sh
          scripts/check-webview-safety.sh
          scripts/check-ui-strings.sh
          scripts/check-screen-imports.sh
          scripts/check-image-loader.sh
          if git grep -nE 'ZemerTeam|raw\.githubusercontent\.com' -- . ':!docs' ':!.internal' ':!*.csv' ':!*.md' ':!.github'; then echo "Dependence on another project's server found"; exit 1; fi
          # TODO (controller): add `test -f gradle/verification-metadata.xml` here once the file is committed (Step 5b.4).
      - name: Build-logic tests (module-graph rules)
        run: scripts/ci-gradle.sh -p buildSrc test
      - name: Module graph
        run: scripts/ci-gradle.sh checkModuleGraph
      - name: Build and unit tests (all modules, lint included)
        run: scripts/ci-gradle.sh build test
      - name: Build both flavors
        run: scripts/ci-gradle.sh :app:assembleFossDebug :app:assembleGmsDebug
      - name: Schema is committed and unchanged
        # git diff ignores untracked files, so a forgotten new version file (2.json) would pass; status sees both.
        run: |
          out="$(git status --porcelain -- data/schemas)"
          if [ -n "$out" ]; then echo "Room schema changed or uncommitted:"; echo "$out"; exit 1; fi
      - name: Print schema as annotations when it changed
        if: failure()
        run: |
          f="$(git status --porcelain -- data/schemas | awk '{print $2}' | head -1)"
          gzip -9 -c "$f" | base64 -w0 | fold -w 3000 | awk '{ printf "::error title=schema-%03d::%s\n", NR, $0 }'
      - name: Upload schema when it changed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: room-schema, path: data/schemas, retention-days: 3 }
      - name: Dependency licenses
        # The license plugin needs --no-parallel on Gradle 9 multi-project builds.
        run: scripts/ci-gradle.sh checkLicense --no-parallel
  glass-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { api: [26, 34] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: scripts/ci-gradle.sh :designsystem:connectedDebugAndroidTest
  app-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { api: [26, 34] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: scripts/ci-gradle.sh :app:connectedFossDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=app.aria.music.ui
  playback-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { api: [26, 34] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: scripts/ci-gradle.sh :playback:connectedDebugAndroidTest :app:connectedFossDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notPackage=app.aria.music.ui
